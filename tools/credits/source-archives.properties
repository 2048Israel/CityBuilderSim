# CR1-J: the complete corresponding sources Build EXE.bat ships beside the exe, in source/
# (Jerus, 2026-11-17: archives beside the exe, not upstream links alone). tools.Packaging
# fetches each into a cache outside git once, checks its SHA-256 and stages it; the build
# stops when one is missing or differs. Changing the runtime or OpenJFX changes these too:
# each file and URL names its version (Packaging checks that), so a version bumped alone fails.
archives=openjfx,runtime,build
openjfx.file=jfx-21+31.tar.gz
openjfx.what=OpenJFX, the openjdk/jfx repository at its tag 21+31, with its native code and Gradle build: the build of the javafx 21 jars pom.xml ships
openjfx.version=21+31
openjfx.url=https://github.com/openjdk/jfx/archive/refs/tags/21%2B31.tar.gz
openjfx.sha256=f0d0e58fec31d58b099ffdb7b4ad35f6d18e7d7fb516be1ecf2e59adb004ac95
runtime.file=OpenJDK21U-jdk-sources_21.0.13_9.tar.gz
runtime.what=Eclipse Temurin's source archive of OpenJDK, published beside its binaries: the source of the Java runtime Build EXE.bat links
runtime.version=21.0.13+9
runtime.url=https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk-sources_21.0.13_9.tar.gz
runtime.sha256=b5232c9980d8a0f0459676c084c41c6e2c771ed9e785890b03c6a438406ad1ca
# The CR1-J review: the scripts that controlled the runtime's compilation, Adoptium's temurin-build
# at the commit the JDK's release file names (BUILD_SOURCE, BUILD_SOURCE_REPO; Packaging jdk checks both).
build.file=temurin-build-1cf43d7a3e77886bfea7d550a902e151a87d724d.tar.gz
build.what=Eclipse Temurin's build scripts, the adoptium/temurin-build repository at the commit the runtime's release file names as its BUILD_SOURCE (Apache License 2.0)
build.version=1cf43d7a3e77886bfea7d550a902e151a87d724d
build.url=https://github.com/adoptium/temurin-build/archive/1cf43d7a3e77886bfea7d550a902e151a87d724d.tar.gz
build.sha256=f524e42fdb6480934dae49e59b07bd979763dfb413046f73b8cbceefe5b08591
build.repo=https://github.com/adoptium/temurin-build.git
# The packaging JDK's release file, and the runtime's java.base, must name these; the source above is theirs.
runtime.implementor=Eclipse Adoptium
runtime.vendorVersion=Temurin-21.0.13+9
runtime.javaVersion=21.0.13
# How Build EXE.bat makes the runtime folder from that JDK, with its MODULES; the README gives it,
# and PackagingCheck holds the batch file's jlink line to it.
runtime.jlink=jlink --add-modules java.base,java.desktop,java.scripting,java.sql,jdk.jfr,jdk.unsupported,jdk.localedata --strip-native-commands --strip-debug --no-man-pages --no-header-files --output runtime
